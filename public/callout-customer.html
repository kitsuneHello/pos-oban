<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>呼出し案内</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/callout-customer.css">
</head>
<body class="customer-page">
  <header class="customer-header">
    <div class="customer-brand">
      <span class="customer-brand-icon"><i class="fa-solid fa-bullhorn"></i></span>
      <span class="customer-title" id="customer-org">呼出し案内</span>
    </div>
    <div class="customer-conn" id="customer-conn">
      <i class="fa-solid fa-circle" id="conn-dot"></i><span id="conn-text">接続中</span>
    </div>
  </header>

  <main class="customer-main">
    <p class="customer-note">お客様の注文番号が「お渡し可能」になりましたら、お受け取りください。</p>
    <div class="customer-columns" id="customer-columns"></div>
  </main>

  <footer class="customer-footer">
    <span>最終更新 <span id="customer-updated">--:--:--</span></span>
  </footer>

  <script type="module" src="/js/callout-customer.js"></script>
</body>
</html>
